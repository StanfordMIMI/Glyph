<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="description" content="See how Glyph converts foundation-model embeddings into interpretable clinical concepts and connects them with disease risk and existing research."><title>Glyph · video overview</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f8fb;color:#152536;font:17px/1.6 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:32px 20px}h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin:12px 0 24px}video{display:block;width:100%;max-height:78vh;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:12px}nav{display:flex;gap:20px;flex-wrap:wrap;margin:20px 0}a{color:#0f766e}.playback-actions{display:flex;justify-content:center;margin:14px 0}.playback-actions button{font:inherit;font-weight:600;min-height:44px;padding:10px 20px;background:#0f766e;color:#fff;border:0;border-radius:9px;cursor:pointer}.playback-actions button:hover{background:#115e59}[hidden]{display:none!important}button:focus-visible,a:focus-visible{outline:3px solid #990000;outline-offset:4px}</style></head><body><main><h1>See Glyph in action.</h1>
<video id="overviewVideo" controls autoplay playsinline preload="auto" poster="poster.jpg" aria-label="Glyph overview with narration by Robbie Holland"><source src="glyph-overview.mp4" type="video/mp4"><track kind="captions" src="captions.vtt" srclang="en" label="English"><p><a href="glyph-overview.mp4">Download the video</a></p></video>
<div class="playback-actions"><button id="narrationButton" type="button" hidden>Turn on narration</button></div>
<nav><a href="https://github.com/StanfordMIMI/Glyph">Glyph package</a><a href="../">Demos</a><a href="https://arxiv.org/abs/2611.08922">Read the paper</a><a href="https://stanfordmimi.github.io/Glyph-research/">Research website</a><a href="glyph-overview.mp4" download>Download video</a></nav></main><script>
const video=document.getElementById('overviewVideo');
const narrationButton=document.getElementById('narrationButton');
let attemptingAutoplay=false,hasStarted=false;
function updatePlaybackControls(){
 narrationButton.hidden=!video.paused&&!video.muted&&video.volume>0;
 narrationButton.textContent=video.paused?'Play with narration':'Turn on narration';
}
async function startAutomatically(){
 if(attemptingAutoplay||hasStarted||document.hidden)return;
 attemptingAutoplay=true;
 try{
  video.muted=false;
  await video.play();
  hasStarted=true;
 }catch(error){
  video.muted=true;
  if(video.textTracks.length)video.textTracks[0].mode='showing';
  try{await video.play();hasStarted=true}catch(error){/* Native controls remain available. */}
 }finally{
  attemptingAutoplay=false;
  updatePlaybackControls();
 }
}
narrationButton.addEventListener('click',()=>{
 video.muted=false;
 if(video.volume===0)video.volume=1;
 video.play().then(()=>{hasStarted=true;updatePlaybackControls()}).catch(updatePlaybackControls);
});
video.addEventListener('playing',()=>{hasStarted=true;updatePlaybackControls()});
video.addEventListener('pause',updatePlaybackControls);
video.addEventListener('volumechange',updatePlaybackControls);
video.addEventListener('canplay',startAutomatically);
window.addEventListener('pageshow',startAutomatically);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)startAutomatically()});
startAutomatically();
</script></body></html>
